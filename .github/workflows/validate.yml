name: Validate research skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tools/validate_release.py .
      - run: python -B -m unittest discover -s skills/research-harness/tests -v
      - run: python -B -m unittest discover -s tests -v
      - run: python -B skills/research-harness/examples/run_demo.py
